name: Bug Report
description: Something broke? Tell us what happened.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The more detail you give, the faster we can fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "When I ran `nope 'Cancel my Netflix'`, the simulation crashed after the IVR phase..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "The simulation should complete and show a success message."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `nope "Cancel my Netflix" --simulate`
        2. Wait for IVR phase
        3. See error
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Simulation
        - Live (real call)
        - Web UI
        - CLI
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `nope --version` to check.
      placeholder: "0.2.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error output
      description: Paste any relevant error output.
      render: shell
    validations:
      required: false
